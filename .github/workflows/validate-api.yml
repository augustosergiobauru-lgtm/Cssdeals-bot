name: CSSDeals fast collector validation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/validate-api.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validate size-filtered collector without sending messages
        run: python -u fast_monitor.py --dry-run
